else{m.innerHTML=U.map((d,i)=>`<div class="card"><h3>${t("cert")} — ${t("unit")} ${[33,34,37,38,40][i]}: ${d.t}</h3>${S.sc[i]>=80?`<canvas id="cv${i}"></canvas><button class="p" data-d="${i}">${t("dl")}</button>`:`<p class="mu">${t("ld")} <b>${S.sc[i]===null?"–":S.sc[i]}</b></p>`}</div>`).join("");U.forEach((_,i)=>S.sc[i]>=80&&draw($("#cv"+i),i))}}
function draw(c,i){const W=1200,H=850,x=c.getContext("2d");c.width=W;c.height=H;
let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#2a060c");g.addColorStop(1,"#7a0f1d");x.fillStyle=g;x.fillRect(0,0,W,H);
x.strokeStyle="#ffc933";x.lineWidth=7;x.strokeRect(30,30,W-60,H-60);x.lineWidth=2;x.strokeRect(50,50,W-100,H-100);
x.textAlign="center";x.fillStyle="#ffe9a8";x.font="700 58px Georgia,serif";x.fillText("CERTIFICATE OF ACHIEVEMENT",W/2,170);
x.font="26px sans-serif";x.fillStyle="#ffc933";x.fillText("Reading Units Lab",W/2,220);
x.fillStyle="#fff";x.font="24px sans-serif";x.fillText("This certificate is proudly presented to",W/2,300);
x.font="italic 700 62px Georgia,serif";x.fillStyle="#ffc933";x.fillText(S.id.n,W/2,385,1000);
x.fillStyle="#fff";x.font="26px sans-serif";x.fillText(`Class ${S.id.c}  •  No. ${S.id.p}  •  ${S.id.m}`,W/2,445,1000);
x.fillText("for successfully completing",W/2,520);
x.font="700 38px sans-serif";x.fillText(`Unit ${[33,34,37,38,40][i]} — ${U[i].t}`,W/2,575,1000);
x.font="700 70px Georgia,serif";x.fillStyle="#ffd24a";x.fillText("Score: "+S.sc[i],W/2,670);
x.fillStyle="#ffe9a8";x.font="22px sans-serif";x.fillText(new Date().toLocaleDateString(S.lang==="id"?"id-ID":"en-GB",{day:"numeric",month:"long",year:"numeric"}),W/2,740);
x.fillStyle="#fff";x.font="italic 24px Georgia,serif";x.fillText("Created by Ahmad Budi Leksono",W/2,785)}
function pad(n){return String(n).padStart(2,"0")}
function tick(){$("#clock").textContent=new Date().toLocaleTimeString(S.lang==="id"?"id-ID":"en-GB");
if(!S.id||S.done)return;const l=Math.max(0,Math.ceil((S.end-Date.now())/1000));
$("#tm").textContent=pad(Math.floor(l/60))+":"+pad(l%60);$("#tm").classList.toggle("low",l<300);
if(l<=0){S.done=true;U.forEach((_,u)=>{if(!S.ch[u]){S.ch[u]=true;score(u)}});render()}}
function lock(){if(!S.auth||S.locked||!S.id||S.done)return;S.locked=true;S.err="";try{localStorage.setItem("cl_lock","1")}catch(_){}render()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)lock()});
window.addEventListener("blur",lock);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.a==="lang"){S.lang=S.lang==="id"?"en":"id";render()}
else if(d.a==="theme"){S.theme=S.theme==="dark"?"light":"dark";render()}
else if(b.id==="gl"){const u=$("#gu").value,p=$("#gp").value;if(btoa(u)==="YWRtaW4="&&btoa(p)==="MTIz"){S.auth=true;if(S.locked){S.locked=false;try{localStorage.removeItem("cl_lock")}catch(_){}}S.err="";render()}else{S.err=t("bad");gate()}}
else if(d.v!==undefined){S.view=+d.v;render()}
else if(b.id==="go"){const v=[0,1,2,3].map(i=>$("#f"+i).value.trim());if(v.some(x=>!x)){$("#lg").textContent="⚠ "+t("fill");return}
const nid={n:v[0],c:v[1],p:v[2],m:v[3]};if(S.id&&JSON.stringify(nid)===JSON.stringify(S.id)&&!S.done){S.view=1;render();return}
S.id=nid;S.done=false;build();S.end=Date.now()+2400000;const lg=$("#lg");let k=0;b.disabled=true;
const iv=setInterval(()=>{if(k<3){lg.textContent="⟳ "+t("ana")[k++]}else{clearInterval(iv);S.view=1;render()}},650);tick()}
else if(d.k!==undefined){S.a[S.view-1][d.k][+d.i]=d.o;render()}
else if(d.c!==undefined){const u=+d.c;score(u);S.ch[u]=true;render()}
else if(d.r!==undefined){const u=+d.r;bu(u,Object.values(S.id).join("|").toLowerCase()+Date.now());render()}
else if(d.d!==undefined){const a=document.createElement("a");a.href=$("#cv"+d.d).toDataURL("image/png");a.download=`Certificate-${S.id.n.replace(/\W+/g,"_")}-Unit${[33,34,37,38,40][+d.d]}.png`;a.click()}});
document.addEventListener("change",e=>{if(e.target.dataset.s!==undefined)S.a[S.view-1].s[+e.target.dataset.s]=e.target.value});
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();
if(e.key==="Enter"&&e.target.id&&e.target.id[0]==="g"&&$("#gl"))$("#gl").click();
if((e.ctrlKey||e.metaKey)&&["c","v","x","a","u","s","p","i","j","t","n"].includes(k)||e.key==="F12"||e.key==="PrintScreen"||(e.shiftKey&&e.key==="Insert")){e.preventDefault();if(e.key==="PrintScreen")try{navigator.clipboard.writeText("")}catch(_){}}});
["copy","cut","paste","contextmenu","selectstart","dragstart","drop"].forEach(n=>document.addEventListener(n,e=>{if(n==="selectstart"&&e.target.closest&&e.target.closest("input"))return;e.preventDefault()}));
setInterval(tick,1000);tick();render();
</script></body></html>
